name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

env:
  QT_VERSION: '6.7.3'

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "Version: $ver"

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia qtshadertools'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download dependencies (libmpv + WinSparkle)
        shell: pwsh
        run: |
          .\scripts\download-deps.ps1

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt
        shell: pwsh
        run: |
          windeployqt --release --qmldir qml "build/Release/iina-windows.exe"
          Copy-Item deps/lib/libmpv-2.dll "build/Release/"
          if (Test-Path deps/lib/WinSparkle.dll) {
            Copy-Item deps/lib/WinSparkle.dll "build/Release/"
          }

      # ── Installer ──
      - name: Install InnoSetup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          # Create ICO from SVG (InnoSetup needs .ico)
          # For CI, we skip custom icon if not available
          if (-not (Test-Path "resources/icons/iina.ico")) {
            New-Item -ItemType Directory -Force -Path dist
            # Build without custom icon
            (Get-Content installer/iina-windows.iss) -replace 'SetupIconFile=.*', '; SetupIconFile removed (no .ico available)' | Set-Content installer/iina-windows-ci.iss
            iscc installer/iina-windows-ci.iss
          } else {
            New-Item -ItemType Directory -Force -Path dist
            iscc installer/iina-windows.iss
          }

      # ── Portable ZIP ──
      - name: Build Portable ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          powershell -ExecutionPolicy Bypass -File scripts/package-portable.ps1 -BuildDir "build\Release" -Version $ver

      # ── Code Signing Placeholder ──
      - name: Code Signing (Placeholder)
        shell: pwsh
        run: |
          Write-Host "CODE SIGNING: Not yet configured"
          Write-Host "To enable, add AUTHENTICODE_CERT and AUTHENTICODE_PASSWORD secrets"
          Write-Host "Then uncomment the signing commands below:"
          Write-Host ""
          Write-Host '# $cert = [System.Convert]::FromBase64String($env:AUTHENTICODE_CERT)'
          Write-Host '# [IO.File]::WriteAllBytes("cert.pfx", $cert)'
          Write-Host '# signtool sign /f cert.pfx /p $env:AUTHENTICODE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 build\Release\iina-windows.exe'
          Write-Host '# signtool sign /f cert.pfx /p $env:AUTHENTICODE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist\IINA-Windows-*-Setup.exe'

      # ── Upload Artifacts ──
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: IINA-Windows-Installer
          path: dist/IINA-Windows-*-Setup.exe
          retention-days: 90

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: IINA-Windows-Portable
          path: dist/IINA-Windows-*-Portable.zip
          retention-days: 90

      # ── GitHub Release ──
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "IINA for Windows v${{ steps.version.outputs.VERSION }}"
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            dist/IINA-Windows-*-Setup.exe
            dist/IINA-Windows-*-Portable.zip
          body: |
            ## IINA for Windows v${{ steps.version.outputs.VERSION }}

            ### Downloads
            | Package | Description |
            |---------|-------------|
            | `IINA-Windows-${{ steps.version.outputs.VERSION }}-Setup.exe` | Installer (recommended) |
            | `IINA-Windows-${{ steps.version.outputs.VERSION }}-Portable.zip` | Portable edition (no install) |

            ### Requirements
            - Windows 10 or later (64-bit)
            - No additional dependencies required

            ### What's New
            See [CHANGELOG.md](CHANGELOG.md) for details.

            ---
            **Note:** This is a pre-release beta. Please report issues at https://github.com/iina/iina-windows/issues
